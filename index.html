<!-- TOP BAR UJIAN KHUSUS VERSI PC -->
<div id="pcTopExamBar" style="display:none; position:fixed; top:0; left:0; width:100%; height:50px; background:#0f172a; color:#fff; z-index:99999; display:flex; align-items:center; justify-content:space-between; padding:0 20px; font-family:sans-serif; border-bottom:2px solid #334155; box-sizing:border-box;">
  <button id="btnPcExit" style="background:#ef4444; color:white; border:none; padding:7px 18px; border-radius:6px; font-weight:bold; cursor:pointer;">🔒 KELUAR</button>
  <div id="pcQuote" style="color:#38bdf8; font-weight:bold; font-size:14px;">🛡️ Mr. Syahill is watching you!!</div>
  <div style="display:flex; align-items:center; gap:15px;">
    <button id="btnPcRefresh" style="background:#3b82f6; color:white; border:none; padding:6px 14px; border-radius:6px; font-weight:bold; cursor:pointer;">🔄 Muat Ulang</button>
    <div id="pcTimer" style="background:#1e293b; padding:6px 12px; border-radius:6px; font-weight:bold; color:#facc15; font-size:14px;">⏳ 01:10:00</div>
  </div>
</div>

<script>
  if (window.AndroidBridge && window.AndroidBridge.onInitTopBar) {
    window.AndroidBridge.onInitTopBar((data) => {
      const bar = document.getElementById('pcTopExamBar');
      if (bar) bar.style.display = 'flex';

      // Timer hitung mundur
      let secondsLeft = (data.duration || 70) * 60;
      setInterval(() => {
        if (secondsLeft > 0) {
          secondsLeft--;
          let h = Math.floor(secondsLeft / 3600);
          let m = Math.floor((secondsLeft % 3600) / 60);
          let s = secondsLeft % 60;
          document.getElementById('pcTimer').innerText = `⏳ ${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
        }
      }, 1000);
    });

    document.getElementById('btnPcExit').onclick = () => {
      const pin = prompt('Masukkan PIN Pengawas / Keluar:');
      if (pin) {
        window.AndroidBridge.verifyExitPin(pin);
      }
    };

    document.getElementById('btnPcRefresh').onclick = () => {
      window.AndroidBridge.refreshExam();
    };

    window.AndroidBridge.onPinFailed(() => {
      alert('⚠️ PIN Salah! Dilarang keluar tanpa izin pengawas.');
    });
  }
</script>
